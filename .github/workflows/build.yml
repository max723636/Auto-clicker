name: APK bauen
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          if [ -f AutoClicker.zip ]; then unzip -q -o AutoClicker.zip; fi
          cd "$(dirname "$(find . -name settings.gradle.kts | head -n 1)")"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/AutoClicker.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-APK
          path: AutoClicker.apk
      - name: Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest AutoClicker.apk --title "Auto Clicker" --notes "Debug-APK"